name: Build desktop release

on:
  push:
    branches:
      - arena/dd82e13d-minecraft-alpha-found-version
    paths:
      - 'src/**'
      - 'agent/**'
      - 'tests/**'
      - 'pom.xml'
      - 'scripts/**'
      - 'run.*'
      - 'test.*'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha-desktop-release
  cancel-in-progress: false

env:
  VERSION: '0.12.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test native engine
        run: ./test.sh
      - name: Test real AWT fullscreen transitions
        run: xvfb-run -a java -Djava.awt.headless=false -cp .test-classes FullscreenTests
      - name: Build and test optional Java 8 runtime mod
        shell: bash
        run: |
          set +e
          mvn -B -ntp -f agent/pom.xml clean package dependency:copy-dependencies dependency:sources > agent-build.log 2>&1
          RESULT=$?
          cat agent-build.log
          if [ "$RESULT" -ne 0 ]; then
            python3 -c 'import pathlib; print("::error::" + pathlib.Path("agent-build.log").read_text()[-10000:].replace("\n", "%0A"))'
            exit "$RESULT"
          fi
      - name: Smoke-test live instrumentation on Java 17
        run: java "-javaagent:agent/target/alpha-ambient-agent-${VERSION}.jar=alpha/ambient/AgentSmoke\$Chunk" -cp agent/target/test-classes alpha.ambient.AgentSmoke
      - name: Preflight isolated packaged agent on Java 17
        run: java "-javaagent:agent/target/alpha-ambient-agent-${VERSION}.jar=alpha/ambient/AgentProbe\$Chunk" -jar agent/target/alpha-ambient-agent-${VERSION}.jar
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Test encounter logic and scene adapter on Java 8
        run: java -cp "agent/target/classes:agent/target/test-classes:agent/target/dependency/*" org.junit.runner.JUnitCore alpha.ambient.StateTest alpha.ambient.DirectorTest alpha.ambient.SceneIntegrationTest alpha.ambient.WatcherTest alpha.ambient.OfflinePatcherTest alpha.ambient.AmbientAgentTest
      - name: Smoke-test live instrumentation on legacy Java 8
        run: java "-javaagent:agent/target/alpha-ambient-agent-${VERSION}.jar=alpha/ambient/AgentSmoke\$Chunk" -cp agent/target/test-classes alpha.ambient.AgentSmoke
      - name: Preflight isolated packaged agent on Java 8
        run: java "-javaagent:agent/target/alpha-ambient-agent-${VERSION}.jar=alpha/ambient/AgentProbe\$Chunk" -jar agent/target/alpha-ambient-agent-${VERSION}.jar
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build executable JAR with original-audio decoder
        run: mvn -B -ntp clean package dependency:copy-dependencies dependency:sources
      - name: Verify executable entry point and decoder registration
        shell: bash
        run: |
          set +e
          (
            set -e
            java -Djava.awt.headless=true -jar target/alpha-desktop-${VERSION}.jar --check-runtime
            python3 scripts/package-release.py --verify
            java -Djava.awt.headless=true -jar target/alpha-desktop-${VERSION}.jar --check-agent-preflight
            java -Djava.awt.headless=true -jar target/alpha-desktop-${VERSION}.jar --check-recovery
          ) > packaged-verify.log 2>&1
          RESULT=$?
          cat packaged-verify.log
          if [ "$RESULT" -ne 0 ]; then
            python3 -c 'import pathlib; print("::error::" + pathlib.Path("packaged-verify.log").read_text()[-10000:].replace("\n", "%0A"))'
            exit "$RESULT"
          fi
      - name: Package desktop distribution
        run: python3 scripts/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-jvm
          path: release/*
          if-no-files-found: error

  windows:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Remember bundled legacy runtime
        shell: pwsh
        run: '"ALPHA_LEGACY_JAVA_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-jvm
          path: release
      - name: Stage compiled game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target | Out-Null
          Copy-Item "release/alpha-desktop-$env:VERSION.jar" target
      - name: Build and smoke-test Windows EXE with bundled Java
        shell: pwsh
        run: |
          try {
            Start-Transcript -Path windows-build.log
            ./scripts/package-windows.ps1 -Version $env:VERSION
            Stop-Transcript
          } catch {
            Write-Output "::error::$($_.Exception.Message)"
            Stop-Transcript -ErrorAction SilentlyContinue
            if (Test-Path windows-build.log) {
              $Details = (Get-Content windows-build.log -Tail 45) -join '%0A'
              Write-Output "::error::Windows packaging log: $Details"
            }
            throw
          }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            release/*.exe
            release/*-windows-x64-portable.zip
            release/SHA256SUMS-windows.txt
          if-no-files-found: error

  publish:
    needs: [build, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}-desktop.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Alpha Desktop ${VERSION} — Windows EXE preview ${GITHUB_RUN_NUMBER}" \
            --notes-file RELEASE_NOTES.md \
            release/*
